plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    // Kotlin coexists with Java; bytecode target 24 (runs on Java 25 runtime used by MC 26.2)
    id 'org.jetbrains.kotlin.jvm' version '2.2.20'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2 — NeoForge artifacts require Java 25 attributes.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Kotlin shares the same source set / toolchain as Java.
// Kotlin compiler reads sibling Java sources (no need for precompiled Java classes).
// Java compile then consumes Kotlin class output (plugin wires compileJava -> compileKotlin).
// Do NOT add mutual classpath dependsOn — that creates a circular task graph.
kotlin {
    jvmToolchain(25)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        // Kotlin 2.2 max official jvmTarget is 24; class files still run on Java 25.
        // Java stays at 25 for NeoForge variant matching (see gradle.properties validation mode).
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_24)
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            // GraalVM polyglot on OpenJDK 25: quiet interpreter-only warning; allow Truffle native access
            systemProperty 'polyglot.engine.WarnInterpreterOnly', 'false'
            jvmArgument '-XX:+EnableDynamicAgentLoading'
            jvmArgument '--enable-native-access=ALL-UNNAMED'
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// GraalVM JS spike — Showdown battles (Java 25 / OpenJDK). Set false if deps break resolution.
// Research: org.graalvm.polyglot 25.0.x / 25.1.x ship for JDK 25; official Cobblemon pinned 22.3.0 + Java 21.
ext.graalSpikeEnabled = true
ext.graalVersion = '25.1.3'

dependencies {
    // Kotlin stdlib (plugin also brings it). Pin version to match kotlin.jvm plugin.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    // Bundle stdlib into the mod jar so production clients don't need a separate Kotlin mod.
    jarJar(group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib', version: '[2.0,3.0)') {
        version {
            prefer '2.2.20'
        }
    }

    // --- GraalVM polyglot + JS (Showdown runner v0 + spike) ---
    // On OpenJDK/Oracle JDK 25: works in interpreter-only (fallback) without Graal compiler;
    // optimizing runtime needs GraalVM JDK or --upgrade-module-path + JVMCI.
    //
    // NOTE: org.graalvm.polyglot:js is packaging=pom. Plain `implementation "...:js:ver"` is
    // resolved by Gradle as an empty jar library and **does not** pull js-language/truffle.
    // Use @pom (Maven type=pom) plus explicit runtime language jars so Context.eval("js") works.
    if (graalSpikeEnabled) {
        implementation "org.graalvm.polyglot:polyglot:${graalVersion}"
        // POM aggregator (same as Maven <type>pom</type>)
        implementation "org.graalvm.polyglot:js:${graalVersion}@pom"
        // Explicit runtime language + Truffle (also pulled via POM; listed for clarity / jarJar)
        runtimeOnly "org.graalvm.js:js-language:${graalVersion}"
        runtimeOnly "org.graalvm.truffle:truffle-runtime:${graalVersion}"
        // Bundle polyglot + JS engine into the mod jar for production clients (not just dev runClient).
        // js-language alone is large; truffle-runtime is required at runtime; ICU is pulled via POM.
        jarJar(group: 'org.graalvm.polyglot', name: 'polyglot', version: '[25.0,26.0)') {
            version {
                prefer graalVersion
            }
        }
        jarJar(group: 'org.graalvm.js', name: 'js-language', version: '[25.0,26.0)') {
            version {
                prefer graalVersion
            }
        }
        jarJar(group: 'org.graalvm.truffle', name: 'truffle-runtime', version: '[25.0,26.0)') {
            version {
                prefer graalVersion
            }
        }
        // Shadowed ICU used by js-language (org.graalvm.shadowed:icu4j), not plain com.ibm.icu.
        jarJar(group: 'org.graalvm.shadowed', name: 'icu4j', version: '[25.0,26.0)') {
            version {
                prefer graalVersion
            }
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Cobblemon ships ~25k resource files. On Windows, Gradle's incremental fingerprint
// can race (file listed for MD5 then deleted mid-copy / partial clean) and fail with:
//   "Failed to create MD5 hash for file ... as it does not exist"
// Official Gradle guidance for unreadable destination content: doNotTrackState.
tasks.named('processResources', ProcessResources).configure {
    doNotTrackState('Large cobblemon resource tree; avoid Windows processResources MD5 races')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Windows: runClient / Defender often locks files under build/, so Gradle's Delete
// leaves a partial tree that then breaks processResources. Prefer a full rmdir.
tasks.named('clean', Delete).configure {
    delete = [] // skip default incomplete deletes
    doLast {
        def buildDir = layout.buildDirectory.get().asFile
        if (!buildDir.exists()) {
            return
        }
        // Best-effort recursive delete (cmd rmdir handles long trees better than Java on Win)
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        if (isWindows) {
            def pb = new ProcessBuilder('cmd', '/c', 'rmdir', '/s', '/q', buildDir.absolutePath)
            pb.redirectErrorStream(true)
            def proc = pb.start()
            proc.waitFor()
        }
        if (buildDir.exists()) {
            // Fallback: Gradle delete of remaining children
            project.delete(buildDir)
        }
        if (buildDir.exists()) {
            logger.warn(
                "clean: could not fully delete {} — close runClient / stop Gradle daemons " +
                "and delete the folder manually if builds keep failing.",
                buildDir
            )
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
// Debug helper: ./gradlew printGraalCp
tasks.register("printGraalCp") {
    doLast {
        def cfg = configurations.runtimeClasspath
        println "=== runtimeClasspath (graal-related) ==="
        cfg.files
                .findAll {
                    def n = it.name.toLowerCase()
                    n.contains("graal") || n.contains("truffle") || n.contains("polyglot") ||
                            n.contains("icu4j") || n.startsWith("js-") || n.contains("regex") || n == "xz-${graalVersion}.jar".toLowerCase()
                }
                .each { println it }
    }
}
